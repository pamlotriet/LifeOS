<ion-content class="[--background:transparent]"><main class="mx-auto min-h-full max-w-xl px-4 pb-8 pt-4"><ion-header app-page-header title="Customise Today" backUrl="/today"></ion-header><p class="intro">Choose which sections appear on your Today dashboard.</p><section class="settings-card">@for (section of sections; track section.id) { <label><span><ion-icon [name]="section.icon"></ion-icon>{{ section.label }}</span><input type="checkbox" [checked]="today.show(section.id)" (change)="today.setPreference(section.id, $any($event.target).checked)"></label> }</section></main></ion-content>
