<span class="muscle-badge">{{ item().muscle | translate }}</span>
<h3>{{ item().name }}</h3>
<p class="muted">{{ item().equipment || 'No equipment specified' | translate }}</p>
@if (item().notes) {
  <p class="workout-notes">{{ item().notes }}</p>
}
<div class="library-actions">
  <button type="button" class="button primary" [disabled]="saving()" (click)="add.emit()">
    {{ 'messages.add_to_count_5a227d' | translate: { p0: dayLabel() } }}</button
  ><button type="button" class="text-button" [disabled]="saving()" (click)="edit.emit()">
    {{ 'Edit' | translate }}</button
  ><button
    type="button"
    class="text-button remove"
    [disabled]="saving()"
    [attr.aria-label]="'Delete ' + item().name | translate"
    (click)="remove.emit()"
  >
    {{ 'Delete' | translate }}
  </button>
</div>
