<span
  class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-cyan-400/30 to-violet-500/30 text-lg font-bold"
  >{{ item().name.charAt(0).toUpperCase() }}</span
><span class="min-w-0 flex-1"
  ><strong class="block truncate">{{ item().name }}</strong
  ><span class="block truncate text-xs text-[var(--text-secondary)]">{{
    item().username
  }}</span></span
>
@if (item().favourite) {
  <span class="text-xl text-amber-300">★</span>
}
