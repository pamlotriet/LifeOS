<ion-content
  ><main
    class="home-page box-border mx-auto w-full max-w-275! px-8! pt-9! pb-12! text-foreground md:m-0! md:max-w-none! md:pr-10! md:pl-12! max-[600px]:px-4! max-[600px]:pt-6! max-[600px]:pb-7.5! [&_a]:text-inherit [&_a]:no-underline [&_a]:focus-visible:outline-2 [&_a]:focus-visible:outline-ring [&_a]:focus-visible:outline-offset-3 [&_h1]:m-0 [&_h2]:m-0 [&_h3]:m-0 [&_p]:m-0 motion-reduce:**:transition-none!"
  >
    <header
      class="mb-6 flex items-end justify-between gap-6 border-0! border-b! border-solid! border-border! rounded-none! bg-none! p-0! pb-6.5! max-[1150px]:flex-wrap max-[600px]:gap-5 [&_h1]:text-[clamp(30px,3vw,42px)] [&_h1]:leading-[1.2] [&_h1]:tracking-[-1.4px] [&_h1]:font-medium max-[600px]:[&_h1]:text-[31px] [&_h1_span]:text-primary"
    >
      <div>
        <p class="mb-3! text-[10px] font-[650] tracking-[1.8px] uppercase text-(--text-secondary)">
          {{ formattedToday() }}
        </p>
        <h1>
          <span>{{ greetingKey | translate }}</span>
        </h1>
        <p class="mt-2.5! text-[13px] text-(--text-secondary)">
          {{ 'home.your_plans_progress_and_everyday_essentials' | translate }}
        </p>
      </div>
    </header>
    <app-carousel
      [label]="'home.your_daily_overview' | translate"
      [previousLabel]="'home.previous_metrics' | translate"
      [nextLabel]="'home.next_metrics' | translate"
    >
      @for (metric of dashboardState.overviewMetrics(); track metric.title) {
        <a
          appHomeMetricCard
          [metric]="metric"
          [progress]="
            metric.route === '/nutrition'
              ? calculateProgressPercentage(dashboardState.calories(), dashboardState.calorieGoal())
              : calculateProgressPercentage(dashboardState.trainingDays(), 7)
          "
          [routerLink]="metric.route"
          class="metric-card flex shrink-0 basis-[calc((100%_-_2.25rem)/4)] snap-start max-[1150px]:basis-[calc((100%_-_0.75rem)/2)] max-[600px]:basis-[85%] min-h-36 min-w-0 flex-col rounded-[17px] border border-border bg-card px-4 pt-4.5 pb-4 shadow-[inset_0_1px_0_color-mix(in_srgb,var(--foreground)_3%,transparent)] hover:border-primary hover:bg-(--card-hover) max-[600px]:pb-3.75 [&_h2]:text-[9px] [&_h2]:font-[650] [&_h2]:tracking-[1.5px] [&_h2]:uppercase [&_h2]:text-(--text-secondary) [&_p]:mt-auto! [&_p]:pt-1 [&_p]:text-[10px] [&_p]:leading-normal [&_p]:text-(--text-secondary) [&>.skeleton-caption]:mt-auto [&>.skeleton-caption]:mb-0.75"
          [attr.aria-busy]="metric.loading"
        ></a>
      }
    </app-carousel>
    <section class="spaces-section" aria-labelledby="spaces-title">
      <div
        class="mb-4 mt-4 flex items-center justify-between [&_h2]:text-[19px] [&_h2]:font-[550] [&_h2]:tracking-[-0.5px] [&>span]:text-[11px] [&>span]:text-(--text-secondary)"
      >
        <h2 id="spaces-title">{{ 'home.your_spaces' | translate }}</h2>
      </div>
      <div class="space-list overflow-hidden rounded-[17px] border border-border bg-card">
        @for (space of dashboardState.spaces; track space.id) {
          <a
            appHomeSpaceRow
            [space]="space"
            [loading]="isSpaceLoading(space.route)"
            [summary]="getSpaceSummary(space.route)"
            [routerLink]="space.route"
            class="space-row flex min-h-17 items-center gap-3 border-b border-border px-4 py-3.5 last:border-b-0 hover:bg-secondary [&_h3]:text-[13px] [&_h3]:font-[650] [&_h3]:leading-[1.3] [&_p]:mt-0.75 [&_p]:text-[11px] [&_p]:leading-[1.4] [&_p]:text-(--text-secondary) [&>div]:min-w-0 [&_small]:ml-auto [&_small]:text-right [&_small]:text-[11px] [&_small]:text-(--text-secondary) max-[600px]:[&_small]:hidden [&_.space-arrow]:ml-0.5 max-[600px]:[&_.space-arrow]:ml-auto"
            [attr.data-accent]="space.accent"
          ></a>
        }
      </div>
    </section></main
></ion-content>
