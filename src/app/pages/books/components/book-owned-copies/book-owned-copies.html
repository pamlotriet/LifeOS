<div class="mb-2 flex items-center justify-between">
  <h2 id="copies-title" class="text-base font-bold">
    {{ 'My Copies & Formats' | translate }}
  </h2>
  <!-- quality-allow shared-button: Compact inline action belongs to the surrounding text or chip layout. -->
  <button
    type="button"
    (click)="addCopy.emit()"
    class="rounded-full border border-cyan-400/60 px-3 py-1.5 text-xs font-semibold text-cyan-200"
  >
    {{ '+ Add Copy' | translate }}
  </button>
</div>
@for (copy of copies(); track copy.id) {
  <div
    class="mb-1.5 flex items-center gap-3 rounded-xl border border-[var(--border)] bg-[var(--card)] px-3 py-2.5 last:mb-0"
  >
    <span class="grid h-8 w-8 place-items-center rounded-lg bg-violet-500/20 text-violet-300"
      ><ion-icon name="book" aria-hidden="true"></ion-icon></span
    ><span class="flex-1 text-sm font-semibold">{{ copy.format | translate }}</span
    ><span class="max-w-28 truncate text-xs text-[var(--text-secondary)]">{{
      copy.label || '—' | translate
    }}</span>
  </div>
}
