<span
  class="grid aspect-[2/3] h-28 shrink-0 place-items-center overflow-hidden rounded-lg border border-white/15 bg-[var(--card)]"
>
  @if (book().coverUrl) {
    <img
      [src]="book().coverUrl"
      [alt]="'Cover of ' + book().title | translate"
      class="h-full w-full object-cover"
      loading="lazy"
    />
  } @else {
    <ion-icon name="book" class="text-2xl text-cyan-200" aria-hidden="true"></ion-icon>
  }
</span>
<span class="min-w-0 flex-1 py-1"
  ><span class="block line-clamp-2 text-base font-bold">{{ book().title | translate }}</span
  ><span class="mt-1 block truncate text-sm text-[var(--text-secondary)]">{{ book().author }}</span
  ><span
    class="mt-3 inline-flex items-center gap-1.5 rounded-full border border-emerald-300/35 bg-emerald-400/10 px-2.5 py-1 text-xs font-semibold text-emerald-200"
    ><ion-icon name="checkmark" aria-hidden="true"></ion-icon>{{ finishedDate() }}</span
  >
  @if (book().rating) {
    <span class="mt-2 block text-xs text-amber-300"
      >{{ '★'.repeat(book().rating)
      }}<span class="text-[var(--border)]">{{ '★'.repeat(5 - book().rating) }}</span></span
    >
  }
</span>
