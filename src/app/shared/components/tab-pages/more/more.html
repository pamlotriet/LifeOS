<ion-content class="[--background:transparent] [--color:#fff]">
  <main class="mx-auto max-w-2xl px-4 pb-32 pt-[calc(env(safe-area-inset-top)+1rem)] text-white">
    <header><p class="text-xs font-semibold uppercase tracking-[.22em] text-cyan-300">LifeOS</p><h1 class="mt-1 text-3xl font-bold">More</h1><p class="mt-1 text-sm text-[#b5cbe2]">Manage your app and security preferences.</p></header>

    <section class="mt-6 overflow-hidden rounded-3xl border border-[#315b7e] bg-[#123451]">
      <a routerLink="/settings" class="flex min-h-20 items-center gap-4 p-4 text-white no-underline">
        <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-cyan-400/25 to-blue-500/25 text-cyan-200"><ion-icon name="settings" class="text-2xl"></ion-icon></span>
        <span class="min-w-0 flex-1"><strong class="block text-base">Settings</strong><span class="mt-0.5 block text-sm text-[#b5cbe2]">Biometrics, automatic locking and vault security</span></span>
        <ion-icon name="chevron-forward" class="text-xl text-[#8daac4]"></ion-icon>
      </a>
    </section>
  </main>
</ion-content>
