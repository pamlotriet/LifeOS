<ion-content class="[--background:transparent] [--color:#fff]">
  <main class="mx-auto max-w-2xl px-4 pb-32 pt-[calc(env(safe-area-inset-top)+1rem)] text-white">
    <header>
      <p class="text-xs font-semibold uppercase tracking-[.22em] text-cyan-300">LifeOS</p>
      <h1 class="mt-1 text-3xl font-bold">More</h1>
      <p class="mt-1 text-sm text-[#b5cbe2]">Manage your app and security preferences.</p>
    </header>

    <section class="mt-6 overflow-hidden rounded-3xl border border-[#315b7e] bg-[#123451]">
      <a
        routerLink="/settings"
        class="flex min-h-20 items-center gap-4 p-4 text-white no-underline"
      >
        <span
          class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-cyan-400/25 to-blue-500/25 text-cyan-200"
          ><ion-icon name="settings" class="text-2xl"></ion-icon
        ></span>
        <span class="min-w-0 flex-1"
          ><strong class="block text-base">Settings</strong
          ><span class="mt-0.5 block text-sm text-[#b5cbe2]"
            >Biometrics, automatic locking and vault security</span
          ></span
        >
        <ion-icon name="chevron-forward" class="text-xl text-[#8daac4]"></ion-icon>
      </a>
      <a
        routerLink="/family"
        class="flex min-h-20 items-center gap-4 border-t border-[#315b7e] p-4 text-white no-underline"
      >
        <span
          class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-violet-400/25 to-blue-500/25 text-violet-200"
          ><ion-icon name="people" class="text-2xl"></ion-icon
        ></span>
        <span class="min-w-0 flex-1"
          ><strong class="block text-base">Family & sharing</strong
          ><span class="mt-0.5 block text-sm text-[#b5cbe2]"
            >Create a family and share planning</span
          ></span
        >
        <ion-icon name="chevron-forward" class="text-xl text-[#8daac4]"></ion-icon>
      </a>
    </section>
    <button
      type="button"
      (click)="logout()"
      [disabled]="signingOut()"
      class="mt-5 flex min-h-14 w-full items-center justify-center gap-2 rounded-2xl border border-rose-400/50 bg-rose-400/10 font-semibold text-rose-200 disabled:opacity-60"
    >
      <ion-icon name="log-out" class="text-xl"></ion-icon
      >{{ signingOut() ? 'Signing out...' : 'Log out' }}
    </button>
    @if (error()) {
      <p
        role="alert"
        class="mt-3 rounded-xl border border-rose-400/40 bg-[#3a1926] p-3 text-center text-sm"
      >
        {{ error() }}
      </p>
    }
  </main>
</ion-content>
