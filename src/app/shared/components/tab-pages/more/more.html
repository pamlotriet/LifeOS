<ion-content class="[--background:transparent] [--color:#fff]">
  <main class="mx-auto max-w-2xl px-4 pb-32 pt-[calc(env(safe-area-inset-top)+1rem)] text-white">
    <header>
      <p class="text-xs font-semibold uppercase tracking-[.22em] text-cyan-300">LifeOS</p>
      <h1 class="mt-1 text-3xl font-bold">More</h1>
      <p class="mt-1 text-sm text-[var(--text-secondary)]">
        Your wellbeing, app preferences and security.
      </p>
    </header>

    <section
      class="mt-6 overflow-hidden rounded-3xl border border-[var(--border)] bg-[var(--card)]"
    >
      <a
        routerLink="/settings"
        class="flex min-h-20 items-center gap-4 p-4 text-white no-underline"
      >
        <span
          class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-cyan-400/25 to-blue-500/25 text-cyan-200"
          ><ion-icon name="settings" class="text-2xl"></ion-icon
        ></span>
        <span class="min-w-0 flex-1"
          ><strong class="block text-base">Settings</strong
          ><span class="mt-0.5 block text-sm text-[var(--text-secondary)]"
            >Automatic locking and vault security</span
          ></span
        >
        <ion-icon name="chevron-forward" class="text-xl text-[var(--text-secondary)]"></ion-icon>
      </a>
    </section>
    <section class="mt-5 overflow-hidden rounded-3xl border border-[var(--border)] bg-[var(--card)]">
      <a routerLink="/nutrition/profile" class="flex min-h-20 items-center gap-4 p-4 text-white no-underline">
        <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[var(--secondary)] text-[var(--primary)]"><ion-icon [icon]="nutritionIcon" class="text-2xl" aria-hidden="true" /></span>
        <span class="min-w-0 flex-1"><strong class="block text-base">Nutrition</strong><span class="mt-0.5 block text-sm text-[var(--text-secondary)]">Your profile, calorie goals and daily targets</span></span>
        <ion-icon name="chevron-forward" class="text-xl text-[var(--text-secondary)]" aria-hidden="true" />
      </a>
    </section>
    @if (updates.enabled) {
      <button
        type="button"
        class="mt-5 flex min-h-12 w-full items-center justify-center rounded-xl border border-[var(--border)] bg-[var(--card)] text-[var(--primary)]"
        [disabled]="updates.checking()"
        (click)="updates.available() ? updates.refresh() : updates.check()"
      >
        {{
          updates.available()
            ? 'Refresh to update LifeOS'
            : updates.checking()
              ? 'Checking for updates...'
              : 'Check for app updates'
        }}
      </button>
      @if (updates.message()) {
        <p class="mt-2 text-center text-sm text-[var(--text-secondary)]" role="status">
          {{ updates.message() }}
        </p>
      }
    }
    <button
      type="button"
      (click)="logout()"
      [disabled]="signingOut()"
      class="mt-5 flex min-h-14 w-full items-center justify-center gap-2 rounded-2xl border border-rose-400/50 bg-rose-400/10 font-semibold text-rose-200 disabled:opacity-60"
    >
      <ion-icon name="log-out" class="text-xl"></ion-icon
      >{{ signingOut() ? 'Signing out...' : 'Log out' }}
    </button>
    @if (error()) {
      <p
        role="alert"
        class="mt-3 rounded-xl border border-rose-400/40 bg-[#3a1926] p-3 text-center text-sm"
      >
        {{ error() }}
      </p>
    }
  </main>
</ion-content>
