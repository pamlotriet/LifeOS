<div class="grid grid-cols-3 gap-2 p-2">
  @for (item of items; track item.id) {
    <ion-card
      [button]="true"
      [routerLink]="item.route ?? null"
      class="m-0 min-h-28 rounded-lg p-2 [--background:var(--card)] [--color:var(--card-foreground)]"
    >
      <div class="flex h-full min-h-24 flex-col justify-between">
        <div class="flex items-start justify-between">
          <ion-icon
            [name]="item.icon"
            size="large"
            class="text-2xl"
            [style.color]="item.color"
          ></ion-icon>
          <ion-icon name="chevron-forward" class="mt-1 text-lg text-(--text-muted)"></ion-icon>
        </div>
        <div>
          <h2 class="m-0 text-sm font-semibold text-foreground">{{ item.title }}</h2>
          <p class="m-0 mt-1 text-[0.65rem] leading-tight text-(--text-secondary)">
            {{ item.description }}
          </p>
        </div>
      </div>
    </ion-card>
  }
</div>
