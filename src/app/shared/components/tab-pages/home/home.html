<ion-content class="[--background:transparent] [--color:#f8fafc]">
  <main class="mx-auto max-w-2xl px-4 pb-8 pt-4 text-white">
    <header class="mb-5 px-1">
      <p class="text-sm tracking-wide text-slate-400">{{ today }}</p>
      <h1 class="mt-1 text-[clamp(1.75rem,7vw,2.5rem)] font-bold leading-tight tracking-tight">{{ greeting }}!</h1>
      <p class="mt-1 text-sm tracking-wide text-slate-400">Small steps make a big life.</p>
    </header>

    <section aria-labelledby="quick-actions-title" class="mb-4 rounded-2xl border border-white/10 bg-[#102942] p-2.5 shadow-lg shadow-black/10">
      <div class="mb-2 flex items-center justify-between px-1">
        <h2 id="quick-actions-title" class="flex items-center gap-2 text-sm font-semibold"><ion-icon name="flash" class="text-xl text-cyan-400" aria-hidden="true"></ion-icon>Quick actions</h2>
        <span class="text-xs text-slate-300">Shortcuts</span>
      </div>
      <div class="grid grid-cols-4 gap-1.5">
        @for (action of quickActions; track action.label) {
          <a [routerLink]="action.route ?? null" class="flex min-h-16 flex-col items-center justify-center gap-1 rounded-xl border border-white/5 bg-[#1b334e] px-1 py-2 text-center text-white no-underline active:scale-[.97]">
            <span class="flex h-7 w-7 items-center justify-center rounded-full" [class]="action.iconBackground"><ion-icon [name]="action.icon" class="text-base" [class]="action.iconColor"></ion-icon></span>
            <span class="text-[10px] leading-tight">{{ action.label }}</span>
          </a>
        }
      </div>
    </section>

    <section aria-label="Life areas" class="grid grid-cols-3 gap-2">
      @for (item of items; track item.id) {
        <a [routerLink]="item.route ?? null" class="flex min-h-[116px] flex-col rounded-2xl border border-[#294661] bg-gradient-to-br from-[#1a3855] via-[#142f4a] to-[#10263d] p-2.5 text-white no-underline shadow-[inset_0_1px_0_rgba(255,255,255,0.08),0_8px_20px_rgba(0,0,0,0.16)] transition-all duration-150 hover:border-cyan-300/30 hover:brightness-110 active:scale-[0.97] focus-visible:outline-2 focus-visible:outline-cyan-300">
          <div class="flex items-start"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ring-1 ring-white/20 shadow-[0_4px_10px_rgba(0,0,0,0.18)]" [class]="item.iconBackground"><ion-icon [name]="item.icon" class="text-[22px]" [class]="item.iconColor"></ion-icon></span></div>
          <div class="mt-auto pt-2"><h2 class="text-sm font-semibold leading-tight tracking-tight">{{ item.title }}</h2><p class="mt-0.5 text-[11px] leading-[1.25] text-slate-300">{{ item.description }}</p></div>
        </a>
      }
    </section>
  </main>
</ion-content>
