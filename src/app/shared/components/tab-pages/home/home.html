<ion-content class="[--background:transparent]">
  <main class="home-page mx-auto min-h-full max-w-2xl px-5 pb-10 pt-4">
    <header class="mb-5 px-1">
      <p class="home-muted text-sm tracking-wide">{{ today }}</p>
      <h1 class="mt-1 text-[clamp(1.75rem,7vw,2.5rem)] font-bold leading-tight tracking-tight">{{ greeting }}!</h1>
      <p class="home-muted mt-1 text-sm tracking-wide">Small steps make a big life.</p>
    </header>

    <section aria-labelledby="quick-actions-title" class="home-panel relative z-10 mb-5 rounded-[2rem] p-4 sm:p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="quick-actions-title" class="flex items-center gap-2 text-xl font-bold sm:text-2xl"><ion-icon name="flash" class="text-2xl text-cyan-400" aria-hidden="true"></ion-icon>Quick actions</h2>
        <span class="home-muted text-sm font-semibold">Shortcuts</span>
      </div>
      <div class="grid grid-cols-4 gap-2 sm:gap-4">
        @for (action of quickActions; track action.label) {
          <a [routerLink]="action.route ?? null" class="home-action flex min-w-0 flex-col items-center gap-2 text-center no-underline active:scale-[.96]">
            <span class="home-action-icon" [attr.data-accent]="action.accent"><ion-icon [name]="action.icon" aria-hidden="true"></ion-icon></span>
            <span class="text-[11px] font-semibold leading-tight sm:text-sm">{{ action.label }}</span>
          </a>
        }
      </div>
    </section>

    <section aria-label="Life areas" class="relative z-10 grid grid-cols-2 gap-3">
      @for (item of items; track item.id) {
        <a [routerLink]="item.route ?? null" class="home-card relative flex min-h-[122px] items-center gap-3 overflow-hidden rounded-[1.7rem] p-4 no-underline active:scale-[.98]" [class.col-span-2]="item.title === 'Vehicles'" [attr.data-accent]="item.accent">
          <span class="home-card-icon flex h-14 w-14 shrink-0 items-center justify-center rounded-full" [class]="item.iconBackground"><ion-icon [name]="item.icon" class="text-2xl" [class]="item.iconColor" aria-hidden="true"></ion-icon></span>
          <span class="relative z-10 min-w-0"><span class="block text-lg font-bold leading-tight">{{ item.title }}</span><span class="home-muted mt-1 block text-sm leading-snug">{{ item.description }}</span></span>
          <span class="home-card-wave" aria-hidden="true"></span>
        </a>
      }
    </section>
  </main>
</ion-content>
