<ion-app
  ngSkipHydration
  class="bg-background"
  [class.safe-area]="authService.authReady() && authService.isAuthenticated()"
>
  @if (!authService.authReady()) {
    <img src="/assets/splash.png" alt="HomeImage" class="w-full h-full object-cover" />
  } @else if (authService.isAuthenticated()) {
    <ion-router-outlet [swipeGesture]="true" [animated]="false"></ion-router-outlet>
  } @else {
    <img src="/assets/splash.png" alt="HomeImage" class="w-full h-full object-cover" />
    <ion-button
      class="absolute bottom-36 w-4/5 left-1/2 transform -translate-x-1/2 [--background:white] rounded-4xl"
      (click)="authenticate()"
    >
      <ion-icon name="logo-google" slot="start" class="mr-2 text-black"></ion-icon>
      <ion-label class="text-black font-semibold text-lg">Sign in with Google</ion-label>
    </ion-button>
  }
</ion-app>
