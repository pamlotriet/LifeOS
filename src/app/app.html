<ion-app ngSkipHydration class="bg-background safe-area">
  @if (authService.isAuthenticated()) {
    <ion-tabs>
      <ion-tab-bar slot="bottom" class="h-24 bg-sidebar">
        <ion-tab-button
          tab="home"
          class="bg-sidebar [--color:var(--ion-text-color)] [--color-selected:var(--nav-active)]"
        >
          <div class="flex flex-col items-center justify-center">
            <ion-icon size="large" name="home" class="mb-1"></ion-icon>
            <ion-label>Home</ion-label>
          </div>
        </ion-tab-button>
        <ion-tab-button
          tab="stats"
          class="bg-sidebar [--color:var(--ion-text-color)] [--color-selected:var(--nav-active)]"
        >
          <div class="flex flex-col items-center justify-center">
            <ion-icon size="large" name="stats-chart" class="mb-1"></ion-icon>
            <ion-label>Stats</ion-label>
          </div>
        </ion-tab-button>
        <ion-tab-button
          tab="add"
          class="bg-sidebar [--color:var(--ion-text-color)] [--color-selected:var(--nav-active)]"
        >
          <div class="flex flex-col items-center justify-center">
            <div class="flex rounded-full bg-sidebar-ring p-3 mb-4">
              <ion-icon size="large" name="add" class="text-white"></ion-icon>
            </div>
          </div>
        </ion-tab-button>
        <ion-tab-button
          tab="search"
          class="bg-sidebar [--color:var(--ion-text-color)] [--color-selected:var(--nav-active)]"
        >
          <div class="flex flex-col items-center justify-center">
            <ion-icon size="large" name="search" class="mb-1"></ion-icon>
            <ion-label>Search</ion-label>
          </div>
        </ion-tab-button>
        <ion-tab-button
          tab="more"
          class="bg-sidebar [--color:var(--ion-text-color)] [--color-selected:var(--nav-active)]"
        >
          <div class="flex flex-col items-center justify-center">
            <ion-icon size="large" name="ellipsis-vertical" class="mb-1"></ion-icon>
            <ion-label>More</ion-label>
          </div>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  } @else {
    <img src="/assets/splash.png" alt="HomeImage" class="w-full h-full object-cover m-0 p-0 z" />
    <ion-button
      expand="block"
      class="absolute bottom-10 w-4/5 left-1/2 transform -translate-x-1/2"
      (click)="authenticate()"
    >
      <ion-icon name="logo-google" slot="start" class="mr-2"></ion-icon>
      <ion-label class="text-white text-lg">Sign in with Google</ion-label>
    </ion-button>
  }
</ion-app>
