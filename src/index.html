<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LifeOS</title>
    <base href="/" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/lifeos-plum-32.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <link rel="apple-touch-icon" href="icons/lifeos-plum-180.png" />
    <style>
      .lifeos-launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--background, #101116);
        color: var(--foreground, #f1f2f5);
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .lifeos-launch img {
        border-radius: 16px;
      }
      .lifeos-launch strong {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .lifeos-launch p {
        margin: 0;
        font-size: 14px;
        color: var(--text-secondary, #b0b4c0);
      }
      .lifeos-launch-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--border, #343742);
        border-top-color: var(--primary, #c4a3d6);
        border-radius: 50%;
        animation: lifeos-launch-spin 0.9s linear infinite;
      }
      .lifeos-launch button {
        min-height: 44px;
        padding: 10px 20px;
        border: 1px solid var(--border, #343742);
        border-radius: 10px;
        color: inherit;
        background: transparent;
        cursor: pointer;
      }
      @keyframes lifeos-launch-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lifeos-launch-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="lifeos-launch" role="status" aria-label="Loading LifeOS">
        <img src="icons/lifeos-plum-192.png" alt="" width="64" height="64" />
        <strong>LifeOS</strong>
        <p>Getting your space ready...</p>
        <span class="lifeos-launch-spinner" aria-hidden="true"></span>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to use LifeOS.</noscript>
  </body>
</html>
